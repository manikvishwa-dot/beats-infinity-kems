# Backup keep-alive for the Render backend (and, through /health,
# Supabase). The primary pinger is cron-job.org every 10 minutes, but
# cron-job.org auto-disables a job after repeated failures - which
# Render free-tier cold starts can cause. This workflow can't be
# disabled that way, so the backend never stays asleep for long.
#
# GitHub may delay scheduled runs by several minutes under load, and
# pauses schedules after 60 days without repo activity.

name: Keep-Alive

on:
    schedule:
        - cron: "*/14 * * * *"
    workflow_dispatch:

jobs:
    ping:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Ping backend /health
              run: |
                  # Retry so a cold start (Render briefly answering
                  # 502/503 while waking up) doesn't count as a failure.
                  curl --fail --silent --show-error \
                       --max-time 90 \
                       --retry 5 --retry-delay 15 --retry-all-errors \
                       https://beats-infinity-backend.onrender.com/health
